[package]
name = "qwen-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
serde_json = "1"
tokenizers = "0.23"

[features]
default = ["cuda"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
